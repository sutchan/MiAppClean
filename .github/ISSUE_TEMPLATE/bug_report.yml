name: Bug 反馈 / Bug Report
description: 报告使用 MiAppClean 时遇到的问题
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量完整填写以下信息，便于我们快速定位问题。
  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: 例如 Xiaomi 14 / Redmi K70
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统版本
      placeholder: 例如 HyperOS 1.0 / MIUI 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 工具版本
      description: 见页面底部或脚本运行输出（如 v1.10.1）
      placeholder: v1.10.1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么异常？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 index.html
        2. 选择设备 / 模式
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 错误输出 / 截图
      description: 粘贴终端输出或 adb 报错（可脱敏）
    validations:
      required: false
