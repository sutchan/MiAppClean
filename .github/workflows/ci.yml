name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验版本一致性
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$VERSION"
          # 校验 CHANGELOG 是否含该版本
          grep -q "## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG 缺少版本 $VERSION"; exit 1; }
          # 校验 README 展示版本
          grep -q "v$VERSION" README.md || { echo "README 版本号未更新为 v$VERSION"; exit 1; }
          # 校验前端原型 html 展示版本（应用原型入口）
          grep -q "v$VERSION" prototype/app/index.html || { echo "prototype/app/index.html 版本号未更新"; exit 1; }
          # 校验 bat 脚本窗口标题版本
          grep -q "v$VERSION" xiaomi-apk-cleanup.bat || { echo "xiaomi-apk-cleanup.bat 标题版本号未更新"; exit 1; }
          # 校验 apk-data.js 头注释版本
          grep -q "v$VERSION" apk-data.js || { echo "apk-data.js 头注释版本未更新"; exit 1; }

      - name: 校验 apk-data.js 可被 Python 解析
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          src = open("apk-data.js", encoding="utf-8").read()
          m = re.search(r"const APP_DATA\s*=\s*(\{.*?\n\});", src, re.S)
          if not m:
              raise SystemExit("无法解析 APP_DATA")
          js = m.group(1).replace("true","True").replace("false","False").replace("null","None")
          data = eval(js, {"__builtins__":{}}, {})
          total = sum(len(g["items"]) for gs in data.values() for g in gs)
          print(f"解析成功，共 {total} 个包名")
          # 校验每个条目含 risk 字段
          for dev, groups in data.items():
              for g in groups:
                  for it in g["items"]:
                      if "risk" not in it:
                          raise SystemExit(f"缺少 risk 字段: {it}")
          print("所有条目均含 risk 字段")
          PY

      - name: 语法检查 Python 脚本
        run: python3 -m py_compile xiaomi-apk-cleanup.py && echo "py 语法 OK"
