name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验版本一致性
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION=$VERSION"
          # 校验 CHANGELOG 是否含该版本
          grep -q "## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG 缺少版本 $VERSION"; exit 1; }
          # 校验 README 展示版本
          grep -q "v$VERSION" README.md || { echo "README 版本号未更新为 v$VERSION"; exit 1; }
          # 校验前端应用 html 展示版本（应用入口，已移至仓库根 /app）
          grep -q "v$VERSION" app/index.html || { echo "app/index.html 版本号未更新"; exit 1; }
          # 校验 bat 脚本窗口标题版本
          grep -q "v$VERSION" scripts/xiaomi-apk-cleanup.bat || { echo "scripts/xiaomi-apk-cleanup.bat 标题版本号未更新"; exit 1; }
          # 校验 apk-data.js 头注释版本
          grep -q "v$VERSION" apk-data.js || { echo "apk-data.js 头注释版本未更新"; exit 1; }
          # 校验站点首页版本
          grep -q "v$VERSION" index.html || { echo "index.html 版本号未更新"; exit 1; }
          # 校验 Python 脚本头注释与运行打印版本
          grep -q "v$VERSION" scripts/xiaomi-apk-cleanup.py || { echo "scripts/xiaomi-apk-cleanup.py 版本未更新"; exit 1; }
          # 校验精简命令模板版本
          grep -q "v$VERSION" docs/commands.md || { echo "docs/commands.md 版本未更新"; exit 1; }
          # 校验原型 README 与 app 入口版本
          grep -q "v$VERSION" prototype/README.md || { echo "prototype/README.md 版本未更新"; exit 1; }

      - name: 校验 apk-data.js 可被 Python 解析
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          src = open("apk-data.js", encoding="utf-8").read()  # 数据源仍在仓库根
          m = re.search(r"const APP_DATA\s*=\s*(\{.*?\n\});", src, re.S)
          if not m:
              raise SystemExit("无法解析 APP_DATA")
          js = m.group(1).replace("true","True").replace("false","False").replace("null","None")
          data = eval(js, {"__builtins__":{}}, {})
          total = sum(len(g["items"]) for gs in data.values() for g in gs)
          print(f"解析成功，共 {total} 个包名")
          # 校验每个条目含 risk 字段
          for dev, groups in data.items():
              for g in groups:
                  for it in g["items"]:
                      if "risk" not in it:
                          raise SystemExit(f"缺少 risk 字段: {it}")
          print("所有条目均含 risk 字段")
          PY

      - name: 语法检查 Python 脚本
        run: python3 -m py_compile scripts/xiaomi-apk-cleanup.py && echo "py 语法 OK"

      - name: 校验 SEO / GEO 基础设施
        shell: bash
        run: |
          set -e
          echo "== 校验 SEO/GEO 必需文件存在 =="
          for f in robots.txt sitemap.xml llms.txt; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
            echo "存在: $f"
          done

          echo "== 校验 index.html 含结构化数据与 SEO meta =="
          grep -q 'application/ld+json' index.html || { echo "index.html 缺少 JSON-LD 结构化数据"; exit 1; }
          grep -qi 'rel="canonical"' index.html || { echo "index.html 缺少 canonical"; exit 1; }
          grep -q 'og:title' index.html || { echo "index.html 缺少 Open Graph"; exit 1; }
          grep -q 'robots.txt' robots.txt || { echo "robots.txt 未引用自身协议"; exit 1; }

          echo "== 校验 sitemap.xml 含首页与格式 =="
          grep -q '<loc>https://mi-app-clean.pages.dev/</loc>' sitemap.xml || { echo "sitemap.xml 缺少首页 loc"; exit 1; }
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('sitemap.xml'); print('sitemap.xml 格式有效')"

          echo "== 校验 llms.txt 含 H1 标题与文档索引 =="
          head -1 llms.txt | grep -q '^# ' || { echo "llms.txt 首行应为 H1 标题"; exit 1; }
          grep -q 'apk-data.js' llms.txt || { echo "llms.txt 应说明数据源"; exit 1; }

          echo "SEO / GEO 校验全部通过"
